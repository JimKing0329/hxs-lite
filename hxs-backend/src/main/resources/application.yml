server:
  port: 8080

spring:
  profiles:
    active: prod
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  type-aliases-package: com.hxs.model.entity

# JWT 配置
hxs:
  jwt:
    admin-secret-key: ${HXS_JWT_ADMIN_SECRET:hxs-admin}
    admin-ttl: 259200000
    admin-token-name: Authorization
    user-secret-key: ${HXS_JWT_USER_SECRET:hxs}
    user-ttl: 2592000000
    user-token-name: token

# 微信配置（默认值由 profile 文件覆盖）
wechat:
  app-id: ${HXS_WECHAT_APP_ID:}
  app-secret: ${HXS_WECHAT_APP_SECRET:}
