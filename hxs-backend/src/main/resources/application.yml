server:
  port: 8080

spring:
  profiles:
    active: prod

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  type-aliases-package: com.hxs.model.entity

# JWT 配置
hsxf:
  jwt:
    admin-secret-key: hsxf-admin
    admin-ttl: 259200000
    admin-token-name: Authorization
    user-secret-key: hsxf
    user-ttl: 2592000000
    user-token-name: token
  admin:
    sid: ${HSXF_ADMIN_SID:}
    password: ${HSXF_ADMIN_PWD:}

# 微信配置（默认值由 profile 文件覆盖）
wechat:
  app-id: ${HSXF_WECHAT_APP_ID:}
  app-secret: ${HSXF_WECHAT_APP_SECRET:}
